<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    b_usuario.innerHTML = sessionStorage.NICKNAME_USUARIO;

    function dadosGrafico() {
        let totalLike = 0
        let totalFotos = 0
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/curtida/curtidaPorDia/${idUsuario}`)
            .then(r => r.json())
            .then(resultado => {
                console.log(resultado);
                gerarGrafico(resultado)

                for (let i = 0; i < resultado.length; i++) {
                    totalLike += resultado[i].Curtidas;
                }
                likeTotal.innerHTML = `${totalLike}`
            })
            .catch(erro => console.log("Erro:", erro));

        fetch(`/foto/totalFoto/${idUsuario}`)
            .then(r => r.json())
            .then(resultado => {
                totalFotos = resultado.Fotos
                fotoTotal.innerHTML = `${totalFotos}`
            })
            .catch(erro => console.log("Erro:", erro));
            
        fetch(`/curtida/maiorCurtida/${idUsuario}`)
        .then(r => r.json())
        .then(resultado => {

            dia.innerHTML = `${resultado[0].dia}`
            likes.innerHTML = `${resultado[0].total}`
        })
    }

    function gerarGrafico(resultado) {
        
        const labels = resultado.map(item => {
            let data = new Date(item.Data);
            return data.toLocaleDateString("pt-BR", {
            day: "2-digit",
            month: "2-digit"
            });
        })
        const valores = resultado.map(item => item.Curtidas);
        

        criarGrafico(labels, valores);
    }
    let graficoLike;

    function criarGrafico(labels, valores) {
        const ctx = document.getElementById('myChart');

        graficoLike = new Chart(ctx, {
        type: 'line',
        data: {
        labels,
        datasets: [{
            label: 'Curtidas recebidas',
            data: valores,
            borderWidth: 1
        }]
        },
        options: {
        scales: {
            y: {
            beginAtZero: true,
            ticks: {
                precision: 0
            }
            }
        }
        }
    });

    }
</script>
