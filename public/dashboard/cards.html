<script>

    b_usuario.innerHTML = sessionStorage.NICKNAME_USUARIO;

    function enviar() {
    const formData = new FormData();
    formData.append('foto', foto.files[0])
    formData.append('descricao', descricao.value)
    formData.append('id', sessionStorage.ID_USUARIO)

    fetch("/foto/cadastro", {
      method: "POST",
      body: formData
    })
      .then(res => {
        carregarFeed();
      })
      .catch(err => {
        console.log(err);
      })
  }

  function carregarFeed() {
    fetch("/foto/listar")
        .then(res => res.json())
        .then(lista => {
            container.innerHTML = "";

            lista.forEach(foto => {
                container.innerHTML += `
                    <div class="card">
                        <img src="/assets/${foto.url}">
                        <p>${foto.descricao}</p>
                    </div>
                `;
            });
        })
        .catch(err => console.log(err));
}

</script>
