<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoDiário | Explorar</title>


    <link rel="stylesheet" href="./../css/dashboards.css">
    <link rel="stylesheet" href="./../css/estilo.css" />

    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body onload="validarSessao(), carregarFeed()">

    <div class="janela">
        <div class="header-left dash-header">

            <h1>FotoDiário</h1>

            <div class="perfil"><img id="fotoPerfil"></div>

            <div class="hello">
                <h3>Olá, <span id="b_usuario">usuário</span>!</h3>
            </div>

            <div class="btn-nav">
                <h3>Explore o Mundo</h3>
            </div>

            <div class="btn-nav-white">
                <a href="./dashboard.html">
                    <h3>Engajamento</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()">
                <h3>Sair</h3>
            </div>

        </div>
        

        <div class="dash">

            <div class="postagem">
                <div class="miniPerfil"><img id="fotoPerfilMini"></div>
                    <p>
                        <input name="foto" id="foto" type="file"/>
                        <input name="descricao" id="descricao" placeholder="Escreva algo...">
                        <button onclick="enviar()">Enviar</button>
                    </p>
                
            </div>
            <div class="area-parametros-alerta">
                <div id="container">
                </div>
            </div>
        </div>
    </div>

</body>

<script>

    b_usuario.innerHTML = sessionStorage.NICKNAME_USUARIO;
    fotoPerfil.src = `../assets/imgs/${sessionStorage.AVATAR}`;
    fotoPerfilMini.src = `../assets/imgs/${sessionStorage.AVATAR}`

    function enviar() {
    const formData = new FormData();
    formData.append('foto', foto.files[0])
    formData.append('descricao', descricao.value)
    formData.append('id', sessionStorage.ID_USUARIO)

    fetch("/foto/cadastro", {
      method: "POST",
      body: formData
    })
      .then(res => {
        carregarFeed();
      })
      .catch(err => {
        console.log(err);
      })

      foto.value = ''
      descricao.value = ''
  }

  function carregarFeed() {
    fetch("/foto/listar")
        .then(res => res.json())
        .then(lista => {
            container.innerHTML = "";

            for (let i = lista.length-1; i >= 0; i--) {
                var foto = lista[i]
                
                container.innerHTML += `
                    <div class="post">
                        <div class="imagemDesc">
                            <img src="/assets/${foto.url}">
                            <p>${foto.descricao}</p>
                            <div class="like">
                                <button id="botao-${foto.idFoto}" onclick="curtirOuDescurtir(${foto.idFoto})"></button>
                                <div id="likes${foto.idFoto}"></div>
                            </div>
                        </div>
                        
                        <div class="comentario">
                            <div class="comentarPost">
                                <input name="comentario" id="comentario-${foto.idFoto}" placeholder="Comentar..."><button onclick="comentar(${foto.idFoto})"><img src="../assets/imgs/enviar-mensagem.png"></button>
                            </div>
                            <div class="listaComentario" id="listaComentario-${foto.idFoto}"></div>
                        </div>
                    </div>
                `;
                carregarComentarios(foto.idFoto);
                verificarCurtida(foto.idFoto);
                contarLike(foto.idFoto)
            ;
            }
                
        })
        .catch(err => console.log(err));
}

    function comentar(idFoto) {
        var idUsuario = sessionStorage.ID_USUARIO;
        var textoComentario = document.getElementById(`comentario-${idFoto}`).value;

        fetch(`/comentario/comentar/${idFoto}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                comentario: textoComentario,
                idUsuario: idUsuario
            })
        })
            .then(resposta => {
                console.log("resposta:", resposta);
                if (resposta.ok) {
                    alert("Comentado!");
                    document.getElementById(`comentario-${idFoto}`).value = "";
                    carregarComentarios(idFoto);
                } else {
                    alert("Erro ao comentar: " + resposta.status);
                }
            })
            .catch(err => console.log("ERRO:", err));
    }

    function carregarComentarios(idFoto) {
        fetch(`/comentario/listar/${idFoto}`)
        .then(res => res.json())
        .then(lista => {

            document.getElementById(`listaComentario-${idFoto}`).innerHTML = "";
            lista.forEach(c => {
                document.getElementById(`listaComentario-${idFoto}`).innerHTML += `
                    <div class="perfilComentario"><p> <b>${c.nickname}:</b> ${c.comentario}</p></div>
                `;
            });
        });
    }

    
    function curtirOuDescurtir(idFoto) {
        var idUsuario = sessionStorage.ID_USUARIO;
        
        fetch(`/curtida/curtirOuDescurtir/${idFoto}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            idUsuario: idUsuario,
            idFoto: idFoto
            })
        })
        .then(r => r.json())
        .then(resposta => {
            console.log("resposta:", resposta);

            var button = document.getElementById(`botao-${idFoto}`)

            if (resposta.status === "curtido" ) {
                alert("Curtido!");
                button.innerHTML = "❤️"; 
            } else {
                alert("Descurtido");
                button.innerHTML = "🤍";
            }
            contarLike(idFoto);
        })
        .catch(err => console.log("ERRO:", err));
    }

    function contarLike(idFoto) {
        fetch(`/curtida/contar/${idFoto}`)
        .then(r => r.json())
        .then(resposta => {
            document.getElementById(`likes${idFoto}`).innerHTML = resposta[0].totalLikes;
        })
    }

    function verificarCurtida(idFoto) {
        console.log("id foto:", idFoto)
        var idUsuario = sessionStorage.ID_USUARIO;

        fetch(`/curtida/verificar/${idUsuario}/${idFoto}`)
            .then(r => r.json())
            .then(resposta => {
            console.log("resposta:", resposta);

            var button = document.getElementById(`botao-${idFoto}`)

            if (resposta.curtido) {
                button.innerHTML = "❤️"; 
            } else {
                button.innerHTML = "🤍";
            }
            
        })
        .catch(err => console.log("ERRO:", err));
    }
</script>
